<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Hub & Quiz Tracker</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --success: #22c55e;
      --danger: #ef4444;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: #020617;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    nav button {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 0.5rem;
      font-weight: bold;
    }
    nav button.active {
      background: var(--accent);
      color: var(--bg);
    }
    main {
      padding: 2rem;
      max-width: 1000px;
      margin: 0 auto;
    }
    .view { display: none; }
    .view.active { display: block; }
    
    /* Card Styles */
    .card {
      background: var(--card);
      padding: 1.5rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      border: 1px solid #334155;
    }
    
    /* Quiz Options */
    .option-btn {
      display: block;
      width: 100%;
      text-align: left;
      background: #334155;
      color: var(--text);
      border: none;
      padding: 0.8rem 1rem;
      margin: 0.5rem 0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }
    .option-btn:hover { background: #475569; }
    .option-btn.correct { background: var(--success) !important; color: white; }
    .option-btn.incorrect { background: var(--danger) !important; color: white; }
    
    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }
    .stat-box {
      background: #020617;
      padding: 1rem;
      border-radius: 6px;
      text-align: center;
    }
    .stat-number {
      font-size: 2rem;
      font-weight: bold;
      color: var(--accent);
    }
    
    /* PDF Viewer */
    iframe {
      width: 100%;
      height: 600px;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h2>⚡ Study Hub</h2>
    <nav>
      <button class="active" onclick="switchTab('quiz')">Quizzes</button>
      <button onclick="switchTab('slides')">Slides</button>
      <button onclick="switchTab('stats')">Analytics</button>
    </nav>
  </header>

  <main>
    <!-- QUIZ VIEW -->
    <div id="quiz" class="view active">
      <div class="card">
        <span id="quiz-lecture-tag" style="color: var(--accent); font-weight: bold; font-size: 0.85rem;"></span>
        <h3 id="quiz-question">Loading Question...</h3>
        <div id="quiz-options"></div>
        <p id="quiz-feedback" style="font-weight: bold; margin-top: 1rem;"></p>
        <button id="next-btn" style="display:none; padding: 0.5rem 1rem; background: var(--accent); border:none; border-radius:4px; font-weight:bold; cursor:pointer;" onclick="loadNextQuestion()">Next Question</button>
      </div>
    </div>

    <!-- SLIDES VIEW -->
    <div id="slides" class="view">
      <div class="card">
        <h3>Lecture Slides</h3>
        <select id="slide-select" onchange="changeSlide()" style="padding: 0.5rem; width: 100%; margin-bottom: 1rem; background: #334155; color: white; border: none; border-radius: 4px;">
          <option value="3-4. Urea cycle.pdf">Lecture 1: Introduction</option>
          <option value="slides/lecture2.pdf">Lecture 2: Advanced Topics</option>
        </select>
        <iframe id="pdf-viewer" src="3-4. Urea cycle.pdf"></iframe>
      </div>
    </div>

    <!-- STATS VIEW -->
    <div id="stats" class="view">
      <div class="card">
        <h3>Performance Summary</h3>
        <div class="stats-grid">
          <div class="stat-box">
            <div id="stat-total" class="stat-number">0</div>
            <div>Questions Completed</div>
          </div>
          <div class="stat-box">
            <div id="stat-accuracy" class="stat-number">0%</div>
            <div>Overall Accuracy</div>
          </div>
        </div>
      </div>

      <div class="card">
        <h3>Performance by Lecture Topic</h3>
        <div id="topic-breakdown">No data recorded yet.</div>
      </div>
      <button onclick="resetStats()" style="background: var(--danger); color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer;">Reset Analytics Data</button>
    </div>
  </main>

  <script>
    // --- 1. NOTEBOOK LM QUIZ DATA ---
    // Copy-paste quiz questions exported from NotebookLM here:
    const quizData = [
  {
    "lecture": "Lecture 1: Histology 1",
    "question": "A 28-year-old man presents with hemoptysis and progressive shortness of breath. Physical examination reveals bilateral pulmonary crackles on auscultation. Urinalysis demonstrates dysmorphic red blood cells and red blood cell casts. Renal biopsy demonstrates crescentic glomerulonephritis on light microscopy. Direct immunofluorescence staining reveals linear IgG deposition along the basement membrane of the renal corpuscles. Which of the following molecular structures is the primary target of these autoantibodies?",
    "options": [
      "Nephrin protein within filtration slit diaphragms",
      "Podocalyxin glycocalyx on foot process surfaces",
      "Type IV collagen in the fused basement membrane",
      "P-cadherin forming tight junctions between pedicels",
      "Fenestrated endothelial cell surface glycoprotein"
    ],
    "answer": 2
  },
  {
    "lecture": "Lecture 1: Histology 1",
    "question": "A male infant presents shortly after birth with severe generalized edema, ascites, and marked abdominal distension. Laboratory evaluation reveals massive proteinuria and severe hypoalbuminemia. Genetic testing confirms an autosomal recessive mutation in the NPHS1 gene. Kidney biopsy demonstrates mild mesangial hypercellularity, increased mesangial matrix, and irregular microcystic dilatation of the proximal convoluted tubules. Which of the following microscopic structures is directly disrupted as a result of this patient's underlying genetic mutation?",
    "options": [
      "Fenestrated capillary endothelium",
      "Filtration slit diaphragms between podocyte foot processes",
      "Glomerular basement membrane charge barrier",
      "Simple squamous parietal layer of Bowman capsule",
      "Parietal epithelial cells at the urinary pole"
    ],
    "answer": 1
  },
  {
    "lecture": "Lecture 1: Histology 1",
    "question": "A 45-year-old woman undergoes a renal biopsy during an evaluation for toxic tubulopathy. Microscopic examination of the renal cortical labyrinth shows cross sections of tubules lined by simple cuboidal epithelium. The luminal margins appear irregular due to a prominent brush border of densely packed microvilli. The cytoplasm is intensely acidophilic with abundant longitudinally oriented mitochondria in the basal domain, and individual lateral cell boundaries are indistinct. Which of the following physiological processes is primarily carried out by the segment of the nephron described in this biopsy?",
    "options": [
      "Active transport of sodium ions without water reabsorption",
      "Concentration of urine under the influence of antidiuretic hormone",
      "Secretion of hydrogen ions by intercalated dark cells",
      "Reabsorption of all filtered glucose and amino acids",
      "Calcium reabsorption mediated by parathyroid hormone"
    ],
    "answer": 3
  },
  {
    "lecture": "Lecture 1: Histology 1",
    "question": "A 52-year-old man with severe renovascular hypertension due to renal artery stenosis undergoes diagnostic evaluation. Laboratory studies demonstrate marked hyperreninemia. Histological examination of his renal cortical tissue identifies modified smooth muscle cells containing secretory granules situated within the wall of the afferent arteriole near the vascular pole of the renal corpuscle. Which of the following mechanisms directly triggers the endocrine function of these modified arterial cells?",
    "options": [
      "Detection of decreased arterial blood pressure by mechanoreceptors",
      "Monitoring of elevated luminal sodium concentration by osmoreceptors",
      "Direct stimulation by antidiuretic hormone from the posterior pituitary",
      "Secretion of parathyroid hormone in response to hypocalcemia",
      "Passive diffusion of water through aquaporin channels"
    ],
    "answer": 0
  },
  {
    "lecture": "Lecture 1: Histology 1",
    "question": "A 61-year-old woman presenting with severe dehydration and hypovolemia undergoes renal physiological testing. Analysis of her renal cortical tissue highlights a cluster of specialized, tall columnar epithelial cells with closely packed nuclei located at the transition from the distal straight tubule to the distal convoluted tubule, directly adjacent to the vascular pole. Which of the following functions is performed by these specialized tubular cells to help maintain blood pressure homeostasis?",
    "options": [
      "Direct synthesis and secretion of renin into the systemic circulation",
      "Phagocytosis of macromolecular protein complexes stuck in the filtration barrier",
      "Water reabsorption through luminal aquaporin channels in response to aldosterone",
      "Secretion of calcitriol following initial hydroxylation of vitamin D",
      "Monitoring of luminal sodium and chloride concentrations in tubular fluid"
    ],
    "answer": 4
  },
  {
    "lecture": "Lecture 1: Histology 1",
    "question": "A 34-year-old man presents with unquenchable thirst, extreme polyuria, and hypernatremia. Diagnostic workup confirms central diabetes insipidus resulting from a complete lack of neurohypophyseal antidiuretic hormone release. Examination of a renal tissue specimen shows collecting ducts lined by simple cuboidal epithelium located within the cortical medullary rays, exhibiting prominent lateral cell boundaries. Which cell type within these collecting ducts is rendered dysfunctional in this patient due to the absence of antidiuretic hormone action?",
    "options": [
      "Alpha intercalated cells",
      "Beta intercalated cells",
      "Principal cells",
      "Macula densa cells",
      "Extraglomerular mesangial cells"
    ],
    "answer": 2
  },
  {
    "lecture": "Lecture 1: Histology 1",
    "question": "A renal physiologist isolates individual micro-dissected nephron segments from the inner medulla of a mammalian kidney. One specific segment is lined by a thin simple squamous epithelium. Experimental measurements confirm that this segment possesses high passive permeability to sodium, chloride, and potassium ions, but is completely impermeable to water molecules. Which segment of the uriniferous tubule was isolated in this experiment?",
    "options": [
      "Proximal straight tubule",
      "Thin descending limb of Henle loop",
      "Thick ascending limb of Henle loop",
      "Thin ascending limb of Henle loop",
      "Cortical collecting duct"
    ],
    "answer": 3
  },
  {
    "lecture": "Lecture 1: Histology 1",
    "question": "A 64-year-old man with a long-standing history of type 2 diabetes mellitus presents with worsening peripheral edema, hypertension, and heavy proteinuria. Renal biopsy reveals systemic microvascular sclerosis characterized by diffuse glomerular basement membrane thickening and nodular acellular scarring within the mesangial matrix. Which of the following non-pathologic physiological functions is normally performed by the resident mesangial cells within these affected glomeruli?",
    "options": [
      "Phagocytosis of proteins adhered to the glomerular filtration barrier",
      "Formation of filtration slit diaphragms using nephrin and P-cadherin",
      "Synthesis of active calcitriol via hydroxylation of precursor vitamin D",
      "Filtration of plasma components through fenestrations lacking diaphragms",
      "Production of antidiuretic hormone to regulate water permeability"
    ],
    "answer": 0
  },
  {
    "lecture": "Lecture 1: Histology 1",
    "question": "A pathologist reviews a light microscopic section of the human renal cortex stained with hematoxylin and eosin. Surrounding several large, darkly staining acidophilic tubules with occluded lumens, the pathologist notes tubules lined by simple cuboidal epithelium featuring a clear, open lumen without a brush border, smaller cell size leading to more visible nuclei per cross section, and a less acidophilic cytoplasm. Which of the following physiological actions occurs specifically at the nephron segment exhibiting these histological features?",
    "options": [
      "Bulk reabsorption of filtered bicarbonate and amino acids",
      "Sodium and water reabsorption in response to aldosterone",
      "Synthesis of erythropoietin when arterial oxygen content drops",
      "Hydroxylation of vitamin D into active calcitriol",
      "Reabsorption of remaining glucose in the thick straight segment"
    ],
    "answer": 1
  },
  {
    "lecture": "Lecture 1: Histology 1",
    "question": "A histological section of the renal papilla near the apex of a renal pyramid shows large, converging epithelial ducts lined by tall simple columnar cells. Intercalated dark cells are completely absent. These large ducts converge at the area cribrosa to drain directly into a minor calyx. Which of the following statements correctly describes the fluid contained within the lumen of these terminal papillary ducts?",
    "options": [
      "It undergoes active glucose reabsorption via sodium co-transporters",
      "It is modified by hydrogen ion secretion from alpha intercalated cells",
      "It has an ultrafiltrate composition identical to blood plasma minus large proteins",
      "It undergoes osmotic water concentration regulated by parathyroid hormone",
      "It receives no further tubular fluid modification and is considered urine"
    ],
    "answer": 4
  }
]

    let currentQuestionIndex = 0;

    // Initialize Local Storage for Analytics
    let stats = JSON.parse(localStorage.getItem("study_stats")) || {
      total: 0,
      correct: 0,
      topics: {} // Stores { "Lecture Name": { attempted: 0, correct: 0 } }
    };

    function saveStats() {
      localStorage.setItem("study_stats", JSON.stringify(stats));
    }

    // Tab Navigation
    function switchTab(tabId) {
      document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
      if (tabId === 'stats') renderStats();
    }

    // Load Quiz Question
    function loadQuestion(index) {
      const q = quizData[index];
      document.getElementById("quiz-lecture-tag").innerText = q.lecture.toUpperCase();
      document.getElementById("quiz-question").innerText = q.question;
      document.getElementById("quiz-feedback").innerText = "";
      document.getElementById("next-btn").style.display = "none";

      const optionsDiv = document.getElementById("quiz-options");
      optionsDiv.innerHTML = "";

      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(idx, q.answer, q.lecture, btn);
        optionsDiv.appendChild(btn);
      });
    }

    // Handle Answer Submission & Record Stats
    function checkAnswer(selected, correct, topic, button) {
      const buttons = document.querySelectorAll(".option-btn");
      buttons.forEach(btn => btn.disabled = true);

      if (!stats.topics[topic]) {
        stats.topics[topic] = { attempted: 0, correct: 0 };
      }

      stats.total++;
      stats.topics[topic].attempted++;

      if (selected === correct) {
        button.classList.add("correct");
        document.getElementById("quiz-feedback").innerText = "✨ Correct!";
        document.getElementById("quiz-feedback").style.color = "var(--success)";
        stats.correct++;
        stats.topics[topic].correct++;
      } else {
        button.classList.add("incorrect");
        buttons[correct].classList.add("correct");
        document.getElementById("quiz-feedback").innerText = "❌ Incorrect. See correct answer above.";
        document.getElementById("quiz-feedback").style.color = "var(--danger)";
      }

      saveStats();
      document.getElementById("next-btn").style.display = "inline-block";
    }

    function loadNextQuestion() {
      currentQuestionIndex = (currentQuestionIndex + 1) % quizData.length;
      loadQuestion(currentQuestionIndex);
    }

    // Change PDF Slide
    function changeSlide() {
      const pdfUrl = document.getElementById("slide-select").value;
      document.getElementById("pdf-viewer").src = pdfUrl;
    }

    // Render Stats & Weak Areas
    function renderStats() {
      document.getElementById("stat-total").innerText = stats.total;
      const acc = stats.total > 0 ? Math.round((stats.correct / stats.total) * 100) : 0;
      document.getElementById("stat-accuracy").innerText = `${acc}%`;

      const breakdownDiv = document.getElementById("topic-breakdown");
      breakdownDiv.innerHTML = "";

      if (Object.keys(stats.topics).length === 0) {
        breakdownDiv.innerText = "No quizzes completed yet.";
        return;
      }

      for (const [topic, data] of Object.entries(stats.topics)) {
        const topicAcc = Math.round((data.correct / data.attempted) * 100);
        const statusColor = topicAcc < 70 ? "var(--danger)" : "var(--success)";
        
        const topicEl = document.createElement("div");
        topicEl.style.margin = "0.75rem 0";
        topicEl.innerHTML = `
          <div style="display:flex; justify-content:space-between; margin-bottom: 0.25rem;">
            <span><strong>${topic}</strong> (${data.correct}/${data.attempted})</span>
            <span style="color: ${statusColor}; font-weight: bold;">${topicAcc}% Accuracy ${topicAcc < 70 ? '⚠️ Needs Review' : '✅ Mastered'}</span>
          </div>
        `;
        breakdownDiv.appendChild(topicEl);
      }
    }

    function resetStats() {
      if (confirm("Reset all quiz analytics?")) {
        localStorage.removeItem("study_stats");
        stats = { total: 0, correct: 0, topics: {} };
        renderStats();
      }
    }

    // Initialize First Question
    loadQuestion(0);
  </script>
</body>
</html>
